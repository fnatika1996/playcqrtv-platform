<title>CQRTV — скоро</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#17191d;--panel2:#1c1e23;--line:#292b30;--text:#f3f3f2;--muted:#a2a6ad;--orange:#ff7629;--orange2:#ff9a4c;--green:#85d493}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.65 'Lexend Deca',sans-serif;overflow-x:hidden}
.scene{position:relative;isolation:isolate;min-height:100vh;display:grid;place-items:center;padding:32px 22px;overflow:hidden;background:radial-gradient(ellipse at 50% 12%,#382416 0,transparent 42%),linear-gradient(145deg,#101113,#131416 56%,#101113)}
.scene::before,.scene::after{content:"";position:absolute;z-index:-1;inset:-20%;pointer-events:none;opacity:.38;background-image:linear-gradient(115deg,transparent 47%,#ff76291a 48%,#ff762900 50%),linear-gradient(25deg,transparent 54%,#ff9a4c14 55%,transparent 57%),linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 70%)}
.scene::after{inset:auto auto -180px -120px;width:620px;height:620px;border:1px solid #ff762922;border-radius:50%;box-shadow:0 0 0 38px #ff76290a,0 0 0 80px #ff762906;opacity:.7}
.scene.animated::before{animation:light-drift 24s linear infinite}
@keyframes light-drift{to{transform:translate3d(1.5%,1%,0)}}
.card{position:relative;width:min(100%,760px);padding:clamp(24px,5vw,54px);border:1px solid #34363b;border-radius:20px;background:linear-gradient(145deg,#1b1d20ed,#141517f2);box-shadow:0 28px 90px #0009;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background-position:center;background-size:cover;opacity:.22;filter:saturate(.75)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid #ff76294d;border-radius:99px;background:#ff762914;color:#ffad78;font-size:11px;font-weight:700;letter-spacing:.08em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 14px #ff7629}
h1{max-width:650px;margin:23px 0 6px;font:600 clamp(48px,10vw,82px)/.86 Teko,sans-serif;letter-spacing:.01em;text-wrap:balance}
.subtitle{max-width:580px;margin:12px 0 0;color:#d0d1d3;font-size:clamp(15px,2.5vw,19px);line-height:1.6}
.description{max-width:560px;margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.75}
.countdown{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.countdown[hidden]{display:none}.time{min-width:76px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#202227;text-align:center}.time strong{display:block;font:600 32px/.95 Teko,sans-serif;color:var(--text);font-variant-numeric:tabular-nums}.time span{font-size:10px;color:var(--muted)}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:28px}
