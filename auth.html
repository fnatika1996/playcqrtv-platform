<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101113"><title>Аккаунт CQRTV</title><style>
@import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap');
:root{color-scheme:dark;--bg:#101113;--panel:#17191d;--line:#2d3036;--text:#f3f3f2;--muted:#a0a2a9;--orange:#ff7629}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#3b2419 0,transparent 45%),var(--bg);color:var(--text);font:14px "Lexend Deca",sans-serif;display:grid;place-items:center;padding:20px}main{width:min(470px,100%);border:1px solid var(--line);border-radius:16px;padding:28px;background:#17191df2;box-shadow:0 20px 70px #0008}a{color:#ff9b61}h1{font:600 36px/1 "Teko",sans-serif;margin:0 0 8px}p{color:var(--muted);line-height:1.6}label{display:block;margin:15px 0 6px;font-size:12px;font-weight:600}input{width:100%;border:1px solid #393c43;border-radius:9px;background:#202227;color:white;padding:12px;font:inherit}button{width:100%;border:0;border-radius:9px;background:var(--orange);color:#1a130f;padding:12px;margin-top:17px;font:700 13px inherit;cursor:pointer}.status{min-height:22px;color:#ffb786;font-size:12px;line-height:1.5}.links{display:flex;justify-content:space-between;margin-top:17px;font-size:11px}button:disabled{opacity:.6}
</style></head><body><main><a href="/" aria-label="CQRTV">← CQRTV</a><h1 id="title">Вход в аккаунт</h1><p id="desc">Войдите в CQRTV или восстановите пароль.</p><form id="form"><div id="emailrow"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div id="passwordrow"><label>Пароль</label><input name="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required></div><div id="tokenrow" hidden><label>Новый пароль</label><input name="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password"></div><p class="status" id="status" role="status" aria-live="polite"></p><button id="submit">Войти</button></form><div class="links"><a href="/#register" id="signup">Создать аккаунт</a><a href="/rules.html">Правила</a><a href="/privacy.html">Конфиденциальность</a></div></main><script>
const params=new URLSearchParams(location.search),mode=params.get("mode")||"login",form=document.querySelector("#form"),status=document.querySelector("#status"),title=document.querySelector("#title"),desc=document.querySelector("#desc"),button=document.querySelector("#submit"),email=document.querySelector("#emailrow"),password=document.querySelector("#passwordrow"),tokenRow=document.querySelector("#tokenrow"),signup=document.querySelector("#signup");
if(mode==="verify"){title.textContent="Подтверждение email";desc.textContent="Проверяем одноразовую ссылку из письма.";email.hidden=true;password.hidden=true;form.elements.email.required=false;form.elements.password.required=false;button.hidden=true;fetch("/api/auth/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:params.get("token")||""})}).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>status.textContent=ok?d.message:(d.error||"Не удалось подтвердить email.")).catch(()=>{status.textContent="Не удалось проверить ссылку. Проверьте соединение и попробуйте ещё раз."});}
if(mode==="reset"){title.textContent="Новый пароль";desc.textContent="Задайте пароль от 12 до 128 символов: первая буква заглавная, добавьте строчную букву, цифру и спецсимвол.";email.hidden=true;password.hidden=true;form.elements.email.required=false;form.elements.password.required=false;tokenRow.hidden=false;form.elements.newPassword.required=true;form.elements.newPassword.addEventListener("input",validateNewPassword);button.textContent="Сохранить пароль";signup.hidden=true;}
if(mode==="forgot"){title.textContent="Восстановление доступа";desc.textContent="Если аккаунт подтверждён, на email придёт ссылка для смены пароля.";password.hidden=true;form.elements.password.required=false;button.textContent="Отправить ссылку";signup.hidden=true;}
if(mode==="login"){signup.href="/#signup-dialog";}
function passwordError(value){if(value.length<12||value.length>128)return "Пароль должен содержать от 12 до 128 символов.";if(!/^\p{Lu}/u.test(value)||!/\p{Ll}/u.test(value)||!/\p{N}/u.test(value)||!/[^\p{L}\p{N}]/u.test(value))return "Начните пароль с заглавной буквы и добавьте строчную букву, цифру и специальный символ.";return ""}function validateNewPassword(){const input=form.elements.newPassword;const error=passwordError(input.value);input.setCustomValidity(error);return !error}form.addEventListener("submit",async e=>{e.preventDefault();if(mode==="reset"&&!validateNewPassword()){status.textContent=form.elements.newPassword.validationMessage;form.elements.newPassword.reportValidity();return}status.textContent="";button.disabled=true;let route="/api/auth/login",payload={email:form.elements.email.value,password:form.elements.password.value};if(mode==="forgot"){route="/api/auth/forgot";payload={email:form.elements.email.value};}if(mode==="reset"){route="/api/auth/reset";payload={token:params.get("token")||"",password:form.elements.newPassword.value};}try{const r=await fetch(route,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),d=await r.json();status.textContent=d.message||d.error||"Запрос завершён.";if(r.ok&&mode==="login")location.href="/";if(r.ok&&mode==="reset")setTimeout(()=>location.href="/auth.html",900)}catch{status.textContent="Нет связи с сервером. Попробуйте ещё раз."}finally{button.disabled=false}});
if(mode==="login"){const l=document.createElement("a");l.href="/auth.html?mode=forgot";l.textContent="Забыли пароль?";l.style.cssText="display:block;margin-top:12px;font-size:11px";document.querySelector(".links").before(l);}
</script></body></html>
