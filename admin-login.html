<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Вход администратора · CQRTV</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c0d0f;--panel:#191b1e;--line:#383b40;--text:#f5f5f4;--muted:#a2a6ad;--orange:#ff7428}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#402414,transparent 42%),var(--bg);color:var(--text);font:14px 'Lexend Deca',sans-serif}.card{width:min(100%,760px);min-width:0;padding:32px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1d1f22,#151618);box-shadow:0 30px 90px #0009}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;color:#c9cbd0;text-decoration:none;font-size:12px}.back img{width:17px;height:17px;object-fit:contain}.hero{height:170px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#121315}.hero img{width:100%;height:100%;object-fit:cover;opacity:.78}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#111214 0%,#111214df 40%,transparent)}.hero span{position:absolute;z-index:1;left:24px;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.12em;font-weight:700;color:#ff9858}.intro{text-align:center;padding:22px 10px}.mark{width:48px;height:48px;margin:auto auto 10px;display:grid;place-items:center;border:1px solid #ff742844;border-radius:14px;background:#ff74281b;color:var(--orange)}.intro h1{font:600 clamp(37px,7vw,52px)/.95 Teko,sans-serif;margin:0 0 8px}.intro p{max-width:470px;margin:auto;color:#b6b9be;font-size:12px;line-height:1.7}.form{max-width:460px;margin:auto}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:600}.input{height:50px;display:flex;align-items:center;gap:11px;padding:0 13px;border:1px solid #3c3f45;border-radius:9px;background:#212327;color:#9da2a9}.input:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px #ff742825}.input svg,.input img{width:18px;height:18px;flex:none;object-fit:contain}.input input{flex:1;min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit}.input input::placeholder{color:#767b83}.eye{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:#b6bac0;padding:0;cursor:pointer}.eye:hover{color:#ff9b54}.eye img{width:18px;height:18px;object-fit:contain}.submit{height:50px;width:100%;margin-top:5px;border:0;border-radius:9px;background:linear-gradient(100deg,#ff7428,#ff903d);color:#19110b;font:600 14px 'Lexend Deca',sans-serif;cursor:pointer;box-shadow:0 8px 22px #ff74282b}.submit img{width:18px;height:18px;object-fit:contain;filter:brightness(.12)}.mark img{width:26px;height:26px;object-fit:contain}.submit{display:flex;align-items:center;justify-content:center;gap:9px}.submit:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:13px;padding:12px;border:1px solid #81483e;border-radius:8px;background:#321d1b;color:#ffb6a7;font-size:12px;line-height:1.5}.message.show{display:block}.foot{text-align:center;color:#858991;font-size:10px;margin:20px 0 0}.foot a{color:#bfc2c7}:focus-visible{outline:2px solid #ff9858;outline-offset:3px}@media(max-width:580px){body{padding:14px}.card{padding:18px 16px;border-radius:16px}.hero{height:135px}.hero span{left:14px}.intro{padding:18px 2px}.intro h1{font-size:40px}}
</style></head><body><main class="card"><a class="back" href="/"><img src="/assets/icons/cqrtv/ui/arrow-left.svg" alt="">На сайт CQRTV</a><div class="hero"><img src="/assets/admin/admin-hero.png" alt="" aria-hidden="true" decoding="async"><span>CQRTV · CONTROL ROOM</span></div><header class="intro"><div class="mark" aria-hidden="true"><img src="/assets/icons/cqrtv/ui/shield.svg" alt=""></div><h1>Панель администратора</h1><p>Войдите с подтверждённым аккаунтом, которому владелец CQRTV выдал доступ.</p></header>
<form id="login-form" class="form"><div class="field"><label for="email">Рабочий email</label><div class="input"><img src="/assets/icons/cqrtv/ui/mail.svg" alt=""><input id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="name@example.com" required></div></div><div class="field"><label for="password">Пароль</label><div class="input"><img class="pack" src="/assets/icons/cqrtv/ui/lock.svg" alt=""><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Введите пароль" required><button id="eye" class="eye" type="button" aria-label="Показать пароль" aria-pressed="false"><img src="/assets/icons/cqrtv/ui/eye.svg" alt=""></button></div></div><button id="submit" class="submit" type="submit"><img class="pack" src="/assets/icons/cqrtv/ui/login.svg" alt=""><span>Войти в панель</span></button><div id="message" class="message" role="alert" aria-live="polite"></div></form><p class="foot">Доступ выдаётся владельцем CQRTV. <a href="/">Вернуться на сайт</a></p></main>
<script type="module">const form=document.querySelector('#login-form'),email=document.querySelector('#email'),password=document.querySelector('#password'),submit=document.querySelector('#submit'),message=document.querySelector('#message'),eye=document.querySelector('#eye');eye.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';eye.setAttribute('aria-pressed',String(show));eye.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');eye.querySelector('img').src=show?'/assets/icons/cqrtv/ui/eye-closed.svg':'/assets/icons/cqrtv/ui/eye.svg'});form.addEventListener('submit',async e=>{e.preventDefault();message.classList.remove('show');if(!form.reportValidity())return;submit.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Не удалось войти.');location.assign('/admin')}catch(error){message.textContent=error instanceof TypeError?'Сервис временно недоступен. Проверьте подключение и повторите попытку.':error.message;message.classList.add('show')}finally{submit.disabled=false}});</script></body></html>
