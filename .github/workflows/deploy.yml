name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract CQRTV icon pack
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip 7zip-rar
          mkdir -p /tmp/cqrtv-icons assets/icons/cqrtv
          7z x -y -o/tmp/cqrtv-icons "Icon Play CQRTV.rar"
          cp -a "/tmp/cqrtv-icons/Icon Play CQRTV/." assets/icons/cqrtv/
          mkdir -p assets/icons/cqrtv/ui
          cp "assets/icons/cqrtv/Search/Magnifer--playcqrtv.svg" assets/icons/cqrtv/ui/search.svg
          cp "assets/icons/cqrtv/Notifications/Bell--playcqrtv.svg" assets/icons/cqrtv/ui/bell.svg
          cp "assets/icons/cqrtv/Messages Conversation/Chat-Round--playcqrtv.svg" assets/icons/cqrtv/ui/chat.svg
          cp "assets/icons/cqrtv/Essentional UI/Home--playcqrtv.svg" assets/icons/cqrtv/ui/home.svg
          cp "assets/icons/cqrtv/Electronic Devices/Gamepad--playcqrtv.svg" assets/icons/cqrtv/ui/gamepad.svg
          cp "assets/icons/cqrtv/Electronic Devices/Gamepad-Minimalistic--playcqrtv.svg" assets/icons/cqrtv/ui/gamepad-minimalistic.svg
          cp "assets/icons/cqrtv/Sports/Ranking--playcqrtv.svg" assets/icons/cqrtv/ui/ranking.svg
          cp "assets/icons/cqrtv/Users/Users-Group-Rounded--playcqrtv.svg" assets/icons/cqrtv/ui/users.svg
          cp "assets/icons/cqrtv/Settings Fine Tuning/Settings-Minimalistic--playcqrtv.svg" assets/icons/cqrtv/ui/settings.svg
          cp "assets/icons/cqrtv/Messages Conversation/Pen--playcqrtv.svg" assets/icons/cqrtv/ui/edit.svg
          cp "assets/icons/cqrtv/Essentional UI/Check-Circle--playcqrtv.svg" assets/icons/cqrtv/ui/check.svg
          cp "assets/icons/cqrtv/Settings Fine Tuning/Widget--playcqrtv.svg" assets/icons/cqrtv/ui/dashboard.svg
          cp "assets/icons/cqrtv/Business Statistic/Chart--playcqrtv.svg" assets/icons/cqrtv/ui/chart.svg
          cp "assets/icons/cqrtv/Like/Medal-Star--playcqrtv.svg" assets/icons/cqrtv/ui/medal.svg
          cp "assets/icons/cqrtv/Essentional UI/Cup-Star--playcqrtv.svg" assets/icons/cqrtv/ui/cup.svg
          cp "assets/icons/cqrtv/Video Audio Sound/Play--playcqrtv.svg" assets/icons/cqrtv/ui/play.svg
          cp "assets/icons/cqrtv/Security/Shield-Check--playcqrtv.svg" assets/icons/cqrtv/ui/shield.svg
          cp "assets/icons/cqrtv/Users/User-Plus-Rounded--playcqrtv.svg" assets/icons/cqrtv/ui/invite.svg
          test -s assets/icons/cqrtv/ui/home.svg
          icon_count=$(find assets/icons/cqrtv -type f -name '*.svg' | wc -l)
          test "$icon_count" -gt 0
          echo "Extracted $icon_count CQRTV SVG icons."

      - name: Build and publish website image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fnatika1996/playcqrtv-platform:latest
            ghcr.io/fnatika1996/playcqrtv-platform:${{ github.sha }}

      - name: Verify CQRTV icons are inside the published image
        run: |
          image="ghcr.io/fnatika1996/playcqrtv-platform:${{ github.sha }}"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -c 'test -s /srv/assets/icons/cqrtv/ui/home.svg && find /srv/assets/icons/cqrtv/ui -maxdepth 1 -type f | wc -l'
      - name: Deploy project to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: "2150572"
          project-name: playcqrtv
          docker-compose-path: docker-compose.yml

      - name: Verify live website
        shell: bash
        run: |
          for attempt in $(seq 1 3); do
            status=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-live.html --write-out '%{http_code}' https://playcqrtv.com/ 2>/dev/null || true)
            icon_status=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-home-icon.svg --write-out '%{http_code}' 'https://playcqrtv.com/assets/icons/cqrtv/ui/home.svg' 2>/dev/null || true)
            direct_icon_status=$(curl --silent --show-error --max-time 4 --resolve playcqrtv.com:443:2.25.3.45 --location --output /tmp/playcqrtv-direct-icon.svg --write-out '%{http_code}' 'https://playcqrtv.com/assets/icons/cqrtv/ui/home.svg' 2>/dev/null || true)
            if [ "$status" = "200" ] && grep -q 'Профиль игрока' /tmp/playcqrtv-live.html && ! grep -q '�' /tmp/playcqrtv-live.html && [ "$icon_status" = "200" ] && test -s /tmp/playcqrtv-home-icon.svg; then
              echo "Live site is serving the current Russian page and CQRTV icon assets."
              exit 0
            fi
            echo "Still waiting (attempt $attempt/3): page HTTP $status, icon via domain=$icon_status, direct VPS=$direct_icon_status."
            sleep 5
          done
          echo "Live-site verification failed."
          exit 1
