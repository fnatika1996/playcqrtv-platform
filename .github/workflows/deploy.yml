name: CQRTV gated release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cqrtv-production-release
  cancel-in-progress: false

jobs:
  release-preflight:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Test exact immutable main checkout
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          node --test qa/create-deploy-request.test.mjs qa/create-deploy-status-request.test.mjs qa/deployment-v2-policy.test.mjs qa/pin-compose-digests.test.mjs
          python -m unittest qa/deployment_v2_restricted_deploy_test.py

  build-release:
    needs: release-preflight
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: release-artifacts
    permissions:
      contents: read
      packages: write
    outputs:
      web_ref: ${{ steps.build-web.outputs.digest && format('ghcr.io/fnatika1996/playcqrtv-platform@{0}', steps.build-web.outputs.digest) }}
      api_ref: ${{ steps.build-api.outputs.digest && format('ghcr.io/fnatika1996/playcqrtv-api@{0}', steps.build-api.outputs.digest) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and validate CQRTV icon pack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y 7zip 7zip-rar
          mkdir -p /tmp/cqrtv-icons assets/icons/cqrtv/ui
          7z x -y -o/tmp/cqrtv-icons "Icon Play CQRTV.rar"
          node scripts/build-cqrtv-admin-icons.mjs --source "/tmp/cqrtv-icons/Icon Play CQRTV" --out assets/icons/cqrtv/ui
          test -s assets/icons/cqrtv/ui/admin-icon-sprite.svg
          test "$(find assets/icons/cqrtv/ui -maxdepth 1 -type f -name '*.svg' ! -name 'admin-icon-sprite.svg' | wc -l)" -eq 38
          test -s assets/icons/cqrtv/ui/admin-icon-map.json

      - name: Build and publish web image with commit tag only
        id: build-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/fnatika1996/playcqrtv-platform:${{ github.sha }}

      - name: Verify web image by exact digest
        env:
          WEB_IMAGE_DIGEST: ${{ steps.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/fnatika1996/playcqrtv-platform@${WEB_IMAGE_DIGEST}"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -c 'test -s /srv/index.html && test -s /srv/site-closed.html && test -s /srv/assets/icons/cqrtv/ui/home.svg'

      - name: Build and publish API image with commit tag only
        id: build-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./api
          push: true
          tags: ghcr.io/fnatika1996/playcqrtv-api:${{ github.sha }}

      - name: Render exact digest-pinned Compose release
        env:
          WEB_IMAGE_DIGEST: ${{ steps.build-web.outputs.digest }}
          API_IMAGE_DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          set -euo pipefail
          node qa/pin-compose-digests.mjs docker-compose.yml "$RUNNER_TEMP/docker-compose.release.yml" "$WEB_IMAGE_DIGEST" "$API_IMAGE_DIGEST"
          docker compose -f "$RUNNER_TEMP/docker-compose.release.yml" config --quiet
          {
            echo "### Approved build identity"
            echo "- Release commit: $GITHUB_SHA"
            echo "- Web: ghcr.io/fnatika1996/playcqrtv-platform@$WEB_IMAGE_DIGEST"
            echo "- API: ghcr.io/fnatika1996/playcqrtv-api@$API_IMAGE_DIGEST"
            echo "- Both refs are immutable registry digests; no latest tag is used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain same-run manifest for deployment and recovery
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cqrtv-release-compose-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-compose.release.yml
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build-release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}

      - name: Read authenticated backup and running-image evidence
        id: status
        env:
          CQRTV_SSH_HOST: ${{ vars.CQRTV_SSH_HOST }}
          CQRTV_SSH_USER: ${{ vars.CQRTV_SSH_USER }}
          CQRTV_SSH_KNOWN_HOSTS: ${{ vars.CQRTV_SSH_KNOWN_HOSTS }}
          CQRTV_SSH_PRIVATE_KEY: ${{ secrets.CQRTV_SSH_PRIVATE_KEY }}
          CQRTV_RELEASE_SIGNING_KEY: ${{ secrets.CQRTV_RELEASE_SIGNING_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${CQRTV_SSH_HOST:?Configure CQRTV_SSH_HOST in the production Environment}"
          : "${CQRTV_SSH_USER:?Configure the restricted SSH user}"
          : "${CQRTV_SSH_KNOWN_HOSTS:?Pin the VPS host key}"
          key_file="$RUNNER_TEMP/cqrtv-status-key"
          signing_key="$RUNNER_TEMP/cqrtv-status-signing-key"
          known_hosts="$RUNNER_TEMP/cqrtv-status-known-hosts"
          request_file="$RUNNER_TEMP/cqrtv-status-request.json"
          umask 077
          trap 'rm -f "$key_file" "$signing_key" "$known_hosts" "$request_file" "$request_file.sig"' EXIT
          printf '%s\n' "$CQRTV_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$CQRTV_RELEASE_SIGNING_KEY" > "$signing_key"
          printf '%s\n' "$CQRTV_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key_file" "$signing_key" "$known_hosts"
          node qa/create-deploy-status-request.mjs > "$request_file"
          ssh-keygen -Y sign -f "$signing_key" -n cqrtv-release "$request_file" >/dev/null
          signature_b64=$(base64 --wrap=0 "$request_file.sig")
          payload_b64=$(base64 --wrap=0 "$request_file")
          status_json=$(printf 'CQRTV-DEPLOY-STATUS-V1\n%s\n%s\n' "$signature_b64" "$payload_b64" |
            ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=10 -o ClearAllForwardings=yes -T \
              "$CQRTV_SSH_USER@$CQRTV_SSH_HOST")
          STATUS_JSON="$status_json" node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { validateReleaseEvidence } from "./qa/deployment-v2-policy.mjs";
          let data;
          try { data = JSON.parse(process.env.STATUS_JSON); } catch { throw new Error("Server status attestation is invalid JSON."); }
          const evidence = {
            RELEASE_SHA: process.env.RELEASE_SHA, WORKFLOW_SHA: process.env.WORKFLOW_SHA,
            BACKUP_REFERENCE: data.backup_reference, BACKUP_SHA256: data.backup_sha256,
            BACKUP_VERIFIED: String(data.backup_verified),
            PREVIOUS_WEB_REF: data.previous_web_ref, PREVIOUS_API_REF: data.previous_api_ref
          };
          if (data.status_version !== 1 || data.run_id !== process.env.GITHUB_RUN_ID) throw new Error("Server status identity mismatch.");
          validateReleaseEvidence(evidence);
          const keys = ["BACKUP_REFERENCE","BACKUP_SHA256","PREVIOUS_WEB_REF","PREVIOUS_API_REF"];
          for (const key of keys) if (/[\r\n=]/.test(evidence[key])) throw new Error("Invalid attestation field.");
          appendFileSync(process.env.GITHUB_OUTPUT,
            "backup_reference="+evidence.BACKUP_REFERENCE+"\nbackup_sha256="+evidence.BACKUP_SHA256+
            "\nprevious_web_ref="+evidence.PREVIOUS_WEB_REF+"\nprevious_api_ref="+evidence.PREVIOUS_API_REF+"\n");
          NODE

      - name: Re-check signed release evidence
        env:
          RELEASE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          BACKUP_REFERENCE: ${{ steps.status.outputs.backup_reference }}
          BACKUP_SHA256: ${{ steps.status.outputs.backup_sha256 }}
          BACKUP_VERIFIED: "true"
          PREVIOUS_WEB_REF: ${{ steps.status.outputs.previous_web_ref }}
          PREVIOUS_API_REF: ${{ steps.status.outputs.previous_api_ref }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { validateReleaseEvidence } from "./qa/deployment-v2-policy.mjs";
          validateReleaseEvidence(process.env);
          NODE

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: cqrtv-release-compose-${{ github.run_id }}
          path: ${{ runner.temp }}/cqrtv-release

      - name: Create signed release request and use restricted SSH command
        env:
          CQRTV_SSH_HOST: ${{ vars.CQRTV_SSH_HOST }}
          CQRTV_SSH_USER: ${{ vars.CQRTV_SSH_USER }}
          CQRTV_SSH_KNOWN_HOSTS: ${{ vars.CQRTV_SSH_KNOWN_HOSTS }}
          CQRTV_PROJECT_ROOT: ${{ vars.CQRTV_PROJECT_ROOT }}
          CQRTV_SSH_PRIVATE_KEY: ${{ secrets.CQRTV_SSH_PRIVATE_KEY }}
          CQRTV_RELEASE_SIGNING_KEY: ${{ secrets.CQRTV_RELEASE_SIGNING_KEY }}
          RELEASE_SHA: ${{ github.sha }}
          PROJECT_NAME: playcqrtv
          WEB_IMAGE_REF: ${{ needs.build-release.outputs.web_ref }}
          API_IMAGE_REF: ${{ needs.build-release.outputs.api_ref }}
          PREVIOUS_WEB_REF: ${{ steps.status.outputs.previous_web_ref }}
          PREVIOUS_API_REF: ${{ steps.status.outputs.previous_api_ref }}
          BACKUP_REFERENCE: ${{ steps.status.outputs.backup_reference }}
          BACKUP_SHA256: ${{ steps.status.outputs.backup_sha256 }}
          BACKUP_VERIFIED: "true"
          LEGACY_HANDOFF_APPROVED: "false"
        run: |
          set -euo pipefail
          : "${CQRTV_SSH_HOST:?Configure the production Environment variable CQRTV_SSH_HOST}"
          : "${CQRTV_SSH_USER:?Configure the forced-command SSH user CQRTV_SSH_USER}"
          : "${CQRTV_SSH_KNOWN_HOSTS:?Pin the VPS host key in CQRTV_SSH_KNOWN_HOSTS}"
          : "${CQRTV_PROJECT_ROOT:?Set the verified Compose project root}"
          : "${CQRTV_SSH_PRIVATE_KEY:?Configure the restricted forced-command SSH key}"
          : "${CQRTV_RELEASE_SIGNING_KEY:?Configure the separate cqrtv-release signing key}"
          key_file="$RUNNER_TEMP/cqrtv-deploy-key"
          signing_key="$RUNNER_TEMP/cqrtv-release-signing-key"
          known_hosts="$RUNNER_TEMP/cqrtv-known-hosts"
          request_file="$RUNNER_TEMP/cqrtv-deploy-request.json"
          umask 077
          trap 'rm -f "$key_file" "$signing_key" "$known_hosts" "$request_file" "$request_file.sig"' EXIT
          printf '%s\n' "$CQRTV_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$CQRTV_RELEASE_SIGNING_KEY" > "$signing_key"
          printf '%s\n' "$CQRTV_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key_file" "$signing_key" "$known_hosts"
          node qa/create-deploy-request.mjs "$RUNNER_TEMP/cqrtv-release/docker-compose.release.yml" > "$request_file"
          ssh-keygen -Y sign -f "$signing_key" -n cqrtv-release "$request_file" >/dev/null
          payload_b64=$(base64 --wrap=0 "$request_file")
          signature_b64=$(base64 --wrap=0 "$request_file.sig")
          printf 'CQRTV-DEPLOY-REQUEST-V2\n%s\n%s\n' "$signature_b64" "$payload_b64" |
            ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=10 -o ClearAllForwardings=yes -T \
              "$CQRTV_SSH_USER@$CQRTV_SSH_HOST"

      - name: Verify public routes, API health, auth/admin pages and SVG MIME
        run: node qa/deployment-v2-smoke.mjs https://playcqrtv.com
