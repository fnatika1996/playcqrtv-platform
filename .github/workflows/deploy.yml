name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish website image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fnatika1996/playcqrtv-platform:latest
            ghcr.io/fnatika1996/playcqrtv-platform:${{ github.sha }}

      - name: Deploy project to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: "2150572"
          project-name: playcqrtv
          docker-compose-path: docker-compose.yml

      - name: Verify live website
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            status=$(curl --silent --show-error --location --output /tmp/playcqrtv-live.html --write-out '%{http_code}' https://playcqrtv.com/ 2>/dev/null || true)
            if [ "$status" = "200" ] && grep -q 'Профиль игрока' /tmp/playcqrtv-live.html && ! grep -q '�' /tmp/playcqrtv-live.html; then
              echo "Live site is serving the current Russian page without encoding errors."
              exit 0
            fi
            echo "Waiting for deployment to become live (attempt $attempt/24)..."
            sleep 5
          done
          echo "Live-site verification failed."
          exit 1
