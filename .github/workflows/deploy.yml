name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cqrtv-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract CQRTV icon pack
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip 7zip-rar
          mkdir -p /tmp/cqrtv-icons assets/icons/cqrtv/ui
          7z x -y -o/tmp/cqrtv-icons "Icon Play CQRTV.rar"
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Search/Magnifer--playcqrtv.svg" assets/icons/cqrtv/ui/search.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Notifications/Bell--playcqrtv.svg" assets/icons/cqrtv/ui/bell.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Messages Conversation/Chat-Round--playcqrtv.svg" assets/icons/cqrtv/ui/chat.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Essentional UI/Home--playcqrtv.svg" assets/icons/cqrtv/ui/home.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Electronic Devices/Gamepad--playcqrtv.svg" assets/icons/cqrtv/ui/gamepad.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Electronic Devices/Gamepad-Minimalistic--playcqrtv.svg" assets/icons/cqrtv/ui/gamepad-minimalistic.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Sports/Ranking--playcqrtv.svg" assets/icons/cqrtv/ui/ranking.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Users/Users-Group-Rounded--playcqrtv.svg" assets/icons/cqrtv/ui/users.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Settings Fine Tuning/Settings-Minimalistic--playcqrtv.svg" assets/icons/cqrtv/ui/settings.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Messages Conversation/Pen--playcqrtv.svg" assets/icons/cqrtv/ui/edit.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Essentional UI/Check-Circle--playcqrtv.svg" assets/icons/cqrtv/ui/check.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Settings Fine Tuning/Widget--playcqrtv.svg" assets/icons/cqrtv/ui/dashboard.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Business Statistic/Chart--playcqrtv.svg" assets/icons/cqrtv/ui/chart.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Like/Medal-Star--playcqrtv.svg" assets/icons/cqrtv/ui/medal.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Essentional UI/Cup-Star--playcqrtv.svg" assets/icons/cqrtv/ui/cup.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Video Audio Sound/Play--playcqrtv.svg" assets/icons/cqrtv/ui/play.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Security/Shield-Check--playcqrtv.svg" assets/icons/cqrtv/ui/shield.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Users/User-Plus-Rounded--playcqrtv.svg" assets/icons/cqrtv/ui/invite.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Messages Conversation/Letter--playcqrtv.svg" assets/icons/cqrtv/ui/mail.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Security/Lock-Keyhole-Minimalistic--playcqrtv.svg" assets/icons/cqrtv/ui/lock.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Security/Eye--playcqrtv.svg" assets/icons/cqrtv/ui/eye.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Security/Eye-Closed--playcqrtv.svg" assets/icons/cqrtv/ui/eye-closed.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Arrows Action/Login--playcqrtv.svg" assets/icons/cqrtv/ui/login.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Arrows Action/Logout--playcqrtv.svg" assets/icons/cqrtv/ui/logout.svg
          cp "/tmp/cqrtv-icons/Icon Play CQRTV/Arrows/Alt-Arrow-Left--playcqrtv.svg" assets/icons/cqrtv/ui/arrow-left.svg
          test -s assets/icons/cqrtv/ui/home.svg
          icon_count=$(find assets/icons/cqrtv -type f -name '*.svg' | wc -l)
          test "$icon_count" -eq 25
          if grep -RIE --include='*.svg' '<script|<foreignObject|href="https?://|javascript:' assets/icons/cqrtv/ui; then
            echo "Unsafe SVG found in selected published icons."
            exit 1
          fi
          echo "Copied $icon_count selected CQRTV icons into the public image."

      - name: Build and publish website image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fnatika1996/playcqrtv-platform:latest
            ghcr.io/fnatika1996/playcqrtv-platform:${{ github.sha }}

      - name: Verify CQRTV icons are inside the published image
        env:
          WEB_IMAGE_DIGEST: ${{ steps.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/fnatika1996/playcqrtv-platform@${WEB_IMAGE_DIGEST}"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -c 'for icon in home mail lock eye eye-closed login logout arrow-left; do test -s "/srv/assets/icons/cqrtv/ui/$icon.svg" || exit 1; done; test "$(find /srv/assets/icons/cqrtv/ui -maxdepth 1 -type f | wc -l)" -eq 25'
      - name: Build and publish authentication API
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/fnatika1996/playcqrtv-api:latest
            ghcr.io/fnatika1996/playcqrtv-api:${{ github.sha }}

      - name: Record pushed image digests
        env:
          WEB_IMAGE_DIGEST: ${{ steps.build-web.outputs.digest }}
          API_IMAGE_DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Built CQRTV image identities"
            echo "- Web commit tag: ghcr.io/fnatika1996/playcqrtv-platform:$GITHUB_SHA"
            echo "- Web digest: $WEB_IMAGE_DIGEST"
            echo "- API commit tag: ghcr.io/fnatika1996/playcqrtv-api:$GITHUB_SHA"
            echo "- API digest: $API_IMAGE_DIGEST"
            echo "- Hostinger existing-project update uses the verified saved Compose latest refs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit Compose and verify Hostinger action and containers
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          WEB_IMAGE_REF: ghcr.io/fnatika1996/playcqrtv-platform:latest
          API_IMAGE_REF: ghcr.io/fnatika1996/playcqrtv-api:latest
        run: node qa/hostinger-deploy.mjs

      - name: Verify live website and API health (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            page_status=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-live.html --write-out '%{http_code}' https://playcqrtv.com/ 2>/dev/null || true)
            icon_status=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-home-icon.svg --write-out '%{http_code}' 'https://playcqrtv.com/assets/icons/cqrtv/ui/home.svg' 2>/dev/null || true)
            api_status=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-api-health.json --write-out '%{http_code}' 'https://playcqrtv.com/api/health' 2>/dev/null || true)
            if [ "$page_status" = "200" ] &&
              grep -q 'Профиль игрока' /tmp/playcqrtv-live.html &&
              ! grep -q '�' /tmp/playcqrtv-live.html &&
              [ "$icon_status" = "200" ] &&
              test -s /tmp/playcqrtv-home-icon.svg &&
              [ "$api_status" = "200" ] &&
              grep -q 'ok' /tmp/playcqrtv-api-health.json; then
              echo "Read-only page, icon and API health checks passed."
              exit 0
            fi
            echo "Health check retry $attempt/3: page=$page_status icon=$icon_status API=$api_status."
            sleep 5
          done
          echo "Read-only live health verification failed."
          exit 1
