name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cqrtv-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and validate the curated CQRTV icon pack
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip 7zip-rar
          mkdir -p /tmp/cqrtv-icons assets/icons/cqrtv/ui
          7z x -y -o/tmp/cqrtv-icons "Icon Play CQRTV.rar"
          node scripts/build-cqrtv-admin-icons.mjs --source "/tmp/cqrtv-icons/Icon Play CQRTV" --out assets/icons/cqrtv/ui
          test -s assets/icons/cqrtv/ui/admin-icon-sprite.svg
          test "$(find assets/icons/cqrtv/ui -maxdepth 1 -type f -name '*.svg' ! -name 'admin-icon-sprite.svg' | wc -l)" -eq 38
          test -s assets/icons/cqrtv/ui/admin-icon-map.json

      - name: Build and publish website image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fnatika1996/playcqrtv-platform:latest
            ghcr.io/fnatika1996/playcqrtv-platform:${{ github.sha }}

      - name: Verify CQRTV icons are inside the published image
        env:
          WEB_IMAGE_DIGEST: ${{ steps.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/fnatika1996/playcqrtv-platform@${WEB_IMAGE_DIGEST}"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -c 'for icon in home mail lock eye eye-closed login logout arrow-left; do test -s "/srv/assets/icons/cqrtv/ui/$icon.svg" || exit 1; done; test -s /srv/assets/icons/cqrtv/ui/admin-icon-sprite.svg && test "$(find /srv/assets/icons/cqrtv/ui -maxdepth 1 -type f -name "*.svg" ! -name "admin-icon-sprite.svg" | wc -l)" -eq 38 && test -s /srv/assets/icons/cqrtv/ui/admin-icon-map.json'
      - name: Build and publish authentication API
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/fnatika1996/playcqrtv-api:latest
            ghcr.io/fnatika1996/playcqrtv-api:${{ github.sha }}

      - name: Generate digest-pinned Hostinger Compose handoff
        env:
          WEB_IMAGE_DIGEST: ${{ steps.build-web.outputs.digest }}
          API_IMAGE_DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          set -euo pipefail
          node qa/pin-compose-digests.mjs docker-compose.yml "$RUNNER_TEMP/docker-compose.release.yml" "$WEB_IMAGE_DIGEST" "$API_IMAGE_DIGEST"
          docker compose -f "$RUNNER_TEMP/docker-compose.release.yml" config --quiet
      - name: Upload immutable release Compose handoff
        uses: actions/upload-artifact@v6
        with:
          name: cqrtv-compose-release-${{ github.sha }}
          path: ${{ runner.temp }}/docker-compose.release.yml
          if-no-files-found: error
          retention-days: 30

      - name: Record pushed image digests
        env:
          WEB_IMAGE_DIGEST: ${{ steps.build-web.outputs.digest }}
          API_IMAGE_DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Built CQRTV image identities"
            echo "- Web commit tag: ghcr.io/fnatika1996/playcqrtv-platform:$GITHUB_SHA"
            echo "- Web digest: $WEB_IMAGE_DIGEST"
            echo "- API commit tag: ghcr.io/fnatika1996/playcqrtv-api:$GITHUB_SHA"
            echo "- API digest: $API_IMAGE_DIGEST"
            echo "- Hostinger update is allowed only when saved Compose matches both exact immutable digest refs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit Compose and verify Hostinger action and containers
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          WEB_IMAGE_REF: ghcr.io/fnatika1996/playcqrtv-platform@${{ steps.build-web.outputs.digest }}
          API_IMAGE_REF: ghcr.io/fnatika1996/playcqrtv-api@${{ steps.build-api.outputs.digest }}
        run: node qa/hostinger-deploy.mjs

      - name: Verify live website and API health (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            page_status=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-live.html --write-out '%{http_code}' https://playcqrtv.com/ 2>/dev/null || true)
            icon_meta=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-home-icon.svg --write-out '%{http_code} %{content_type}' 'https://playcqrtv.com/assets/icons/cqrtv/ui/home.svg' 2>/dev/null || true)
            icon_status=${icon_meta%% *}
            icon_type=${icon_meta#* }
            api_status=$(curl --silent --show-error --max-time 4 --location --output /tmp/playcqrtv-api-health.json --write-out '%{http_code}' 'https://playcqrtv.com/api/health' 2>/dev/null || true)
            if [ "$page_status" = "200" ] &&
              ! grep -q '�' /tmp/playcqrtv-live.html &&
              home_mode=$(node qa/live-home-smoke.mjs /tmp/playcqrtv-live.html) &&
              [ "$icon_status" = "200" ] &&
              [ "$icon_type" = "image/svg+xml" ] &&
              test -s /tmp/playcqrtv-home-icon.svg &&
              [ "$api_status" = "200" ] &&
              grep -q 'ok' /tmp/playcqrtv-api-health.json; then
              echo "Read-only homepage ($home_mode), SVG MIME and API health checks passed."
              exit 0
            fi
            echo "Health check retry $attempt/3: page=$page_status icon=$icon_status API=$api_status."
            sleep 5
          done
          echo "Read-only live health verification failed."
          exit 1
