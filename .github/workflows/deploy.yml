name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract CQRTV icon pack
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip 7zip-rar
          mkdir -p /tmp/cqrtv-icons assets/icons/cqrtv
          7z x -y -o/tmp/cqrtv-icons "Icon Play CQRTV.rar"
          cp -a "/tmp/cqrtv-icons/Icon Play CQRTV/." assets/icons/cqrtv/
          icon_count=$(find assets/icons/cqrtv -type f -name '*.svg' | wc -l)
          test "$icon_count" -gt 0
          echo "Extracted $icon_count CQRTV SVG icons."

      - name: Build and publish website image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fnatika1996/playcqrtv-platform:latest
            ghcr.io/fnatika1996/playcqrtv-platform:${{ github.sha }}

      - name: Deploy project to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: "2150572"
          project-name: playcqrtv
          docker-compose-path: docker-compose.yml

      - name: Verify live website
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            status=$(curl --silent --show-error --max-time 10 --location --output /tmp/playcqrtv-live.html --write-out '%{http_code}' https://playcqrtv.com/ 2>/dev/null || true)
            icon_status=$(curl --silent --show-error --max-time 10 --location --output /tmp/playcqrtv-home-icon.svg --write-out '%{http_code}' 'https://playcqrtv.com/assets/icons/cqrtv/Essentional%20UI/Home--playcqrtv.svg' 2>/dev/null || true)
            if [ "$status" = "200" ] && grep -q 'Профиль игрока' /tmp/playcqrtv-live.html && ! grep -q '�' /tmp/playcqrtv-live.html && [ "$icon_status" = "200" ] && test -s /tmp/playcqrtv-home-icon.svg; then
              echo "Live site is serving the current Russian page and CQRTV icon assets."
              exit 0
            fi
            echo "Still waiting (attempt $attempt/24): page HTTP $status, icon HTTP $icon_status."
            sleep 5
          done
          echo "Live-site verification failed."
          exit 1
